import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    // AGP 9+ has built-in Kotlin support — no separate kotlin.android plugin needed.
    id 'com.android.application' version '9.2.1'
}

android {
    namespace 'kakacat.icu.iconhelper'
    compileSdk 36

    defaultConfig {
        applicationId 'kakacat.icu.iconhelper'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Kotlin sources live under src/main/kotlin.
    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign with the debug key so `adb install` works without a release keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
        }
    }
}
